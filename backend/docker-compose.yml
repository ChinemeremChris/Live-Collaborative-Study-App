services:
  fastapi:
    build: .
    container_name: deckmate-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: deckmate-celery-worker
    env_file:
      - .env
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: deckmate-celery-beat
    env_file:
      - .env
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: deckmate-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
